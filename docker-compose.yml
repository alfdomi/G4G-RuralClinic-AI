# ────────────────────────────────────────────────────────────────────────────────
# Docker Compose configuration for G4G RuralClinic AI
#
# This configuration separates the application into two services:
#   1. ollama   — Runs the Ollama LLM server (CPU-only)
#   2. app      — Runs the Python/Gradio web interface
#
# Why split?
#   - Clear separation of concerns (model serving vs. UI)
#   - Easier to scale or replace components independently
#   - Resource limits per service for low-end hardware testing
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#   # Access UI at http://localhost:7860
#
# Stop:
#   docker compose down -v
#
# Rebuild after changes:
#   docker compose up --build --force-recreate
#
# Environment variables:
#   Copy .env.example to .env and adjust for your hardware.
#
# ────────────────────────────────────────────────────────────────────────────────

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Ollama model serving. Exposes port 11434 for internal use by the app.
  # ──────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rural-clinic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"           # Host:Container — for local debugging if needed
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      # Persist Ollama model cache between container restarts
      - ollama_data:/root/.ollama
      # Share data directory for sample images, knowledge base, logs
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    # Resource limits tuned for low-end hardware (typical laptop: 8 GB RAM)
    # Adjust in .env if you have more resources available.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G             # ~4 GB for model + ~2 GB headroom
        reservations:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rural-clinic-net

  # ──────────────────────────────────────────────────────────────────────────
  # Gradio/web UI application.
  # Connects to Ollama service via internal Docker network.
  # ──────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rural-clinic-ai:app
    container_name: rural-clinic-app
    restart: unless-stopped
    environment:
      # Point to the ollama service by container name (Docker DNS resolves it)
      - OLLAMA_HOST=http://ollama:11434
      - OFFLINE_MODE=true
      - USE_QUANTIZED=${USE_QUANTIZED:-true}
      - QUANTIZED_MODEL_NAME=${QUANTIZED_MODEL_NAME:-gemma4:e4b-q4_K_M}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "7860:7860"               # Gradio UI
    volumes:
      - ./data:/app/data:rw        # Shared data (sample images, etc.)
      - ./logs:/app/logs:rw        # Shared logs
      # Optional: persist Gradio temp uploads
      - gradio_data:/tmp/gradio
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4.0"             # Python app needs moderate CPU for inference
          memory: 4G               # ~2–4 GB typical for UI + inference
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - rural-clinic-net

  # ──────────────────────────────────────────────────────────────────────────
  # Optional stress-testing container for simulating constrained resources.
  # Usage: docker compose --profile stress run --rm stress \
  #          --timeout 120 --cpu 2 --vm 1 --vm-bytes 2G
  # ──────────────────────────────────────────────────────────────────────────
  stress:
    image: polinux/stress
    container_name: rural-clinic-stress
    profiles: ["stress"]
    networks:
      - rural-clinic-net
    depends_on:
      - ollama
      - app

# ─────────────────────────────────────────────────────────────────────────────
# Volumes: persist model weights and user data across container lifecycle
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: rural-clinic-ollama-data
  gradio_data:
    name: rural-clinic-gradio-data

# ─────────────────────────────────────────────────────────────────────────────
# Network: isolate services on private bridge network
# ─────────────────────────────────────────────────────────────────────────────
networks:
  rural-clinic-net:
    name: rural-clinic-network
    driver: bridge